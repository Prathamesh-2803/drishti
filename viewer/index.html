<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DRISHTI — swipe viewer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <strong>DRISHTI</strong> swipe viewer
  <span class="sep">·</span>
  <label>combo
    <select id="combo">
      <option value="rgb">true colour (B04·B03·B02)</option>
      <option value="nir">false colour (B08·B04·B03)</option>
    </select>
  </label>
  <label><input type="checkbox" id="tgl-unc" /> uncertainty</label>
  <label><input type="checkbox" id="tgl-qa" /> QA fallback mask</label>
  <span class="sep">·</span>
  <button id="fit">fit</button>
  <span class="hint">scroll = zoom · drag = pan · drag the handle = swipe</span>
</header>

<div id="stage">
  <div id="pan">
    <img id="after" class="layer" alt="SR" />
    <div id="before-wrap">
      <img id="before" class="layer" alt="LR" />
    </div>
    <img id="ov-unc" class="layer overlay" alt="uncertainty" hidden />
    <img id="ov-qa" class="layer overlay" alt="QA mask" hidden />
    <div id="divider"><div id="handle"></div></div>
  </div>
  <div id="tag-left" class="tag">LR · 10 m (nearest ×4)</div>
  <div id="tag-right" class="tag">SR · 2.5 m · SEN2SR-Lite</div>
</div>

<aside id="panel">
  <h2>run</h2>
  <dl id="stats"></dl>
  <p class="note">Uncertainty is a test-time-augmentation spread — a proxy.
  MC-dropout confidence ships with the DRISHTI model.</p>
</aside>

<script src="viewer.js"></script>
</body>
</html>
